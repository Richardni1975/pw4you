[workspace]
[package]
name = "pw4you"
version = "0.1.0"
edition = "2021"

[lib]
name = "pw4you_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pw4you-core = { path = "../../core" }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
lettre = "0.11"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
