[package]
name = "pw4you-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "pw4you"
path = "src/main.rs"

[dependencies]
pw4you-core = { path = "../core" }

# GUI — use glow (OpenGL) backend for smaller dependency tree
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["glow"] }
egui_extras = { version = "0.31", features = ["image"] }

# System tray
tray-icon = "0.19"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization for config
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time (for password dialog day hint)
chrono = "0.4"

# File dialog
rfd = "0.15"

# Open files/folders in system explorer
open = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "shellapi",
    "winreg",
    "libloaderapi",
    "processthreadsapi",
    "handleapi",
] }

[build-dependencies]
winres = "0.1"
