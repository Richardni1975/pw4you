[package]
name = "pw4you-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = "0.4"
log = "0.4"
subtle = "2"
walkdir = "2"
base64 = "0.22"
lettre = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }
